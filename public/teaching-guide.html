<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blue Hour · Teaching Design</title><style>*{box-sizing:border-box}body{margin:0;background:#eaece4;color:#2c433d;font:15px/1.8 Arial,'PingFang SC','Microsoft JhengHei',sans-serif}.toolbar{max-width:1000px;margin:auto;padding:20px;display:flex;align-items:center;gap:14px;font-size:12px}.toolbar a{margin-right:auto}button,select{font:inherit;color:inherit;padding:8px 12px;border:1px solid #b9c5ad;background:#faf9f1;border-radius:5px;cursor:pointer}a{color:#587252}main{max-width:1000px;margin:auto}.page{background:#fffef8;margin:0 0 24px;padding:50px 65px;box-shadow:0 3px 20px #253a3010}.page-top{display:flex;justify-content:space-between;font-size:9px;letter-spacing:1.5px;color:#a18b61;border-bottom:1px solid #dce1d2;padding-bottom:18px}h1{font:40px Georgia,serif;margin:28px 0 3px}h2{font-size:24px;font-weight:500;line-height:1.5;margin:25px 0}h3{font-size:16px;margin:24px 0 9px}p{margin:12px 0}.lede{font-size:19px;line-height:1.8}.callout{background:#eef0e4;border-left:3px solid #b2945d;padding:14px 20px;margin:20px 0}table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.65;margin:18px 0}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #e0e4d5;vertical-align:top}th{background:#e7ecde;font-weight:500}li{margin:8px 0}td:first-child{min-width:80px}.note{font-size:12px;color:#8c967f}.footer{margin-top:30px;padding-top:13px;border-top:1px solid #dce1d2;font-size:9px;letter-spacing:1px;color:#98a087}.team td[contenteditable]{background:#f6f2e6}.page:last-child p{overflow-wrap:anywhere}@media(max-width:650px){.page{padding:28px 20px}.toolbar{flex-wrap:wrap}h2{font-size:21px}table{font-size:10px}td,th{padding:8px 5px}h1{font-size:34px}.lede{font-size:16px}}@media print{@page{size:A4;margin:14mm}.toolbar{display:none}body{background:white;font-size:10pt;line-height:1.5}.page{padding:0;margin:0;box-shadow:none;break-after:page}.page:last-child{break-after:auto}.page-top{font-size:7pt;padding-bottom:9px}h1{font-size:28pt;margin:15px 0 0}h2{font-size:17pt;margin:15px 0}h3{font-size:12pt;margin:15px 0 6px}.lede{font-size:13pt}p{margin:9px 0}table{font-size:8.3pt;line-height:1.4;margin:11px 0}th,td{padding:6px 7px}li{margin:5px 0}.callout{padding:10px 13px;margin:13px 0;break-inside:avoid}.note{font-size:8pt}.footer{margin-top:15px;padding-top:10px}tr{break-inside:avoid}h2,h3{break-after:avoid}.team td[contenteditable]{background:none}}
</style></head><body><div class="toolbar"><a id="back" href="/">← Blue Hour</a><label><span id="languageLabel">Language</span> <select id="lang" aria-label="Language"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option></select></label><button id="print" onclick="window.print()">打印 / 保存 PDF</button></div><main id="guide"></main><script>const sections=[{"titles": ["项目简报与学习目标", "專案簡報與學習目標", "Project brief & learning objectives"], "body": ["<p class=\"lede\">让无需读谱的中学生／大学生，通过聆听、角色扮演和共同解释，理解“我的声音怎样为伙伴创造空间”。</p><p>对象：音乐初学者；每 1–2 人一台设备与耳机。主课 60 分钟，默认入门难度；已有基础者自选进阶或 Bebop。场景和角色提供代入，音乐选择与解释才是学习核心。</p><h3>完成本课后，学习者能够</h3><ol><li>在三道平行情境后测中答对至少 2 题，解释低音、和声、旋律和节奏的分工。</li><li>控制曲目与速度，比较有／无贝斯的整体编配，描述一个可听见的差异。</li><li>选择一种角色，完成一轮体验，并解释一次回应或留白的决定。</li><li>以“改变—证据—下一步”反思，回应同伴意见并共同修订一个编配理由。</li></ol><div class=\"callout\">高级选修目标：辨认一个张力音及其解决目标，比较两个大师版本的一处处理差异，再在自己的短句中尝试。无需为了通关而进入 Bebop。</div><p>五种角色：钢琴、贝斯、鼓、萨克斯、吉他。没有贝斯时自动钢琴补充低音；加入贝斯时改用较高音区、去根音配置。这是简化示范，不能概括所有爵士风格，也不意味着有贝斯就禁止根音。</p><h3>新增的声部实验</h3><p>钢琴、贝斯、吉他、萨克斯可选伴奏或 Solo，每次一位主奏。Solo 改变实际旋律材料、音区与节奏，其他声部减少密度。钢琴“自动／含根音／去根音”允许固定乐队后只改变配音；没有贝斯时自动钢琴补低音，有贝斯时减少根音重叠。贝斯 Solo 时钢琴可补充低音。A/B 编制按钮会重置为自动配音、无人 Solo 并回到第一小节。</p>", "<p class=\"lede\">讓無需讀譜的中學生／大學生，透過聆聽、角色扮演和共同解釋，理解「我的聲音怎樣為伙伴創造空間」。</p><p>對象：音樂初學者；每 1–2 人一台裝置與耳機。主課 60 分鐘，預設入門難度；已有基礎者自選進階或 Bebop。場景和角色提供投入感，音樂選擇與解釋才是學習核心。</p><h3>完成本課後，學習者能夠</h3><ol><li>在三道平行情境後測中答對至少 2 題，解釋低音、和聲、旋律和節奏的分工。</li><li>控制曲目與速度，比較有／無貝斯的整體編配，描述一個可聽見的差異。</li><li>選擇一種角色，完成一輪體驗，並解釋一次回應或留白的決定。</li><li>以「改變—證據—下一步」反思，回應同伴意見並共同修訂一個編配理由。</li></ol><div class=\"callout\">高階選修目標：辨認一個張力音及其解決目標，比較兩個大師版本的一處處理差異，再在自己的短句中嘗試。無需為了過關而進入 Bebop。</div><p>五種角色：鋼琴、貝斯、鼓、薩克斯風、吉他。沒有貝斯時自動鋼琴補充低音；加入貝斯時改用較高音域、去根音配置。這是簡化示範，不能概括所有爵士風格，也不代表有貝斯就禁止根音。</p><h3>新增的聲部實驗</h3><p>鋼琴、貝斯、吉他、薩克斯風可選伴奏或 Solo，每次一位主奏。Solo 改變實際旋律材料、音區與節奏，其他聲部減少密度。鋼琴「自動／含根音／去根音」允許固定樂隊後只改變配音；沒有貝斯時自動鋼琴補低音，有貝斯時減少根音重疊。貝斯 Solo 時鋼琴可補充低音。A/B 編制按鈕會重設為自動配音、無人 Solo 並回到第一小節。</p>", "<p class=\"lede\">Help secondary and university beginners explore how their sound creates space for other musicians—through listening, role play and shared explanations, without reading notation.</p><p>Use one device and headphones per learner or pair. The core lesson takes 60 minutes at Beginner difficulty. Intermediate and Bebop are optional extensions. Characters and scenes invite participation; musical choices and explanations are the learning focus.</p><h3>By the end, learners can</h3><ol><li>Score at least 2/3 on parallel post-lesson scenarios about bass, harmony, melody and rhythm.</li><li>Keep the tune and tempo constant, compare the arrangements with and without bass, and describe one audible difference.</li><li>Join a practice round in one role and explain one choice to respond or leave space.</li><li>Reflect using “change—evidence—next step,” respond to a partner and revise a shared arrangement explanation.</li></ol><div class=\"callout\">Optional extension: identify a tension and its target note, compare a choice in two master recordings, and try it in an original phrase. Bebop is never required to complete the beginner course.</div><p>The five roles are piano, bass, drums, saxophone and guitar. Automatic piano supplies low notes without bass and uses higher, rootless voicings when bass joins. This is a simplified example, not a universal rule or a ban on roots.</p><h3>New arrangement experiments</h3><p>Piano, bass, guitar and saxophone offer comping and solo roles, with one featured soloist at a time. Solo changes actual melodic material, register and rhythm while the other parts leave space. Piano Auto / Rooted / Rootless allows a voicing comparison with the band held constant. Auto adds a low foundation without bass and reduces root overlap with a supporting bassist. Piano may supply the foundation during a bass solo. A/B band presets reset automatic voicing, clear the featured soloist and return to bar one.</p>"]}, {"titles": ["60 分钟教学流程", "60 分鐘教學流程", "The 60-minute lesson"], "body": ["<table><tr><th>时间</th><th>活动</th><th>支架与证据</th></tr><tr><td>0–8 分</td><td>独立前测；描述心目中的好合奏。</td><td>三题 0–3 分；先作答再看解释，不排名。</td></tr><tr><td>8–23 分</td><td>预测角色分工；固定曲目、速度、摇摆比例，做有／无贝斯 A/B 试听。</td><td>每次先停止，再从第一小节播放，记录“我预测…我听到…”。贝斯与钢琴配音联动，不能分离二者的独立因果作用。</td></tr><tr><td>23–35 分</td><td>选择角色，先用一个垫再用三个；完成 8 小节挑战，然后练习留白。</td><td>拍点覆盖只作为操作反馈。问“为什么这一次选择不弹？”</td></tr><tr><td>35–48 分</td><td>两人轮换操作者与观察者，提出反例，共同修订编配理由。</td><td>记录双方观点如何改变。仅轮流点击不算共同建构。</td></tr><tr><td>48–54 分</td><td>向 AI 或教师提出一个具体问题，换曲检验建议。</td><td>先说明条件，再验证；不照抄 AI 答案。</td></tr><tr><td>54–60 分</td><td>平行情境后测；填写“改变—证据—下一步”；保存／导出。</td><td>概念目标 ≥2/3；收集一条有证据的解释。</td></tr></table><h3>差异化与可及性</h3><p>需要支持：低速、单垫、视觉拍点、同伴代操作、口述反思。已有基础：选择进阶／Bebop，用短句比较张力与解决。听觉或手速不能作为唯一评价证据。可减少动画、放大浏览器页面，并允许文字描述。</p><p>课前检查耳机、浏览器声音与网络。页面载入后，合奏与提示可本地运行；不承诺断网重新载入。AI 不可用时依次问：“你想改变什么？”“哪些条件不变？”“什么声音支持你的解释？”</p><h3>可选真实演奏迁移（20 分钟，不替代 60 分钟主课）</h3><p>4 分钟检查设备、选择单音或节奏模式；6 分钟录下 20 秒乐句并回听；6 分钟比较同一速度的两次演奏，先写听感再看音高／起音数据；4 分钟与同伴解释一处选择与下一步。无真实乐器者可哼唱、导入自有录音，或用演奏垫做等价解释活动，不因设备差异扣分。指标是有依据的解释和修订，而非检测数值高低。</p>", "<table><tr><th>時間</th><th>活動</th><th>支架與證據</th></tr><tr><td>0–8 分</td><td>獨立前測；描述心目中的好合奏。</td><td>三題 0–3 分；先作答再看解釋，不排名。</td></tr><tr><td>8–23 分</td><td>預測角色分工；固定曲目、速度、搖擺比例，做有／無貝斯 A/B 試聽。</td><td>每次先停止，再從第一小節播放，記錄「我預測…我聽到…」。貝斯與鋼琴配音連動，不能分離兩者的獨立因果作用。</td></tr><tr><td>23–35 分</td><td>選擇角色，先用一個墊再用三個；完成 8 小節挑戰，然後練習留白。</td><td>拍點覆蓋只作為操作回饋。問「為何這一次選擇不彈？」</td></tr><tr><td>35–48 分</td><td>兩人輪換操作者與觀察者，提出反例，共同修訂編配理由。</td><td>記錄雙方觀點如何改變。僅輪流點擊不算共同建構。</td></tr><tr><td>48–54 分</td><td>向 AI 或教師提出一個具體問題，換曲檢驗建議。</td><td>先說明條件，再驗證；不照抄 AI 答案。</td></tr><tr><td>54–60 分</td><td>平行情境後測；填寫「改變—證據—下一步」；儲存／匯出。</td><td>概念目標 ≥2/3；收集一條有證據的解釋。</td></tr></table><h3>差異化與可及性</h3><p>需要支持：低速、單墊、視覺拍點、同伴代操作、口述反思。已有基礎：選擇進階／Bebop，以短句比較張力與解決。聽覺或手速不能作為唯一評量證據。可減少動畫、放大瀏覽器頁面，並允許文字描述。</p><p>課前檢查耳機、瀏覽器聲音與網路。頁面載入後，合奏與提示可在本機執行；不保證斷網重新載入。AI 無法使用時依次問：「你想改變什麼？」「哪些條件不變？」「什麼聲音支持你的解釋？」</p><h3>可選真實演奏遷移（20 分鐘，不取代 60 分鐘主課）</h3><p>4 分鐘檢查裝置、選擇單音或節奏模式；6 分鐘錄下 20 秒樂句並回聽；6 分鐘比較同一速度的兩次演奏，先寫聽感再看音高／起音資料；4 分鐘與同伴解釋一處選擇與下一步。沒有真實樂器者可哼唱、匯入自有錄音，或用演奏墊做等價解釋活動，不因裝置差異扣分。指標是有依據的解釋和修訂，而非偵測數值高低。</p>", "<table><tr><th>Time</th><th>Activity</th><th>Support & evidence</th></tr><tr><td>0–8 min</td><td>Individual pre-quiz; describe a good ensemble.</td><td>Three items, 0–3. Answer before reading explanations; no ranking.</td></tr><tr><td>8–23 min</td><td>Predict roles, then compare bass off/on while holding tune, tempo and swing constant.</td><td>Stop and restart from bar one for each comparison. “I predicted… I heard…” Bass and piano voicing change together, so their separate effects cannot be isolated.</td></tr><tr><td>23–35 min</td><td>Choose a role. Start with one pad, then three. Try the 8-bar challenge, followed by intentional silence.</td><td>Beat coverage is operational feedback. Ask why a learner chose not to play.</td></tr><tr><td>35–48 min</td><td>Pairs alternate player and observer, offer a counterexample and revise a shared explanation.</td><td>Record how each person's idea changed. Taking turns alone is not co-construction.</td></tr><tr><td>48–54 min</td><td>Ask AI or a teacher one specific question. Test the advice in another tune.</td><td>Describe conditions, test, then judge. Do not copy an answer as evidence.</td></tr><tr><td>54–60 min</td><td>Parallel post-quiz; “change—evidence—next step” reflection; save/export.</td><td>Concept target ≥2/3, plus one evidence-based explanation.</td></tr></table><h3>Differentiation & access</h3><p>Offer slow tempo, one pad, visual beats, a partner operating the controls and spoken reflections. Experienced learners may explore Intermediate/Bebop tension and resolution. Hearing and dexterity are not the only evidence routes. Allow reduced motion, browser zoom and written descriptions.</p><p>Check headphones, browser audio and connectivity. Once loaded, the ensemble and local prompts run locally; offline reloading is not promised. Without AI ask: “What would you change?” “What stays constant?” “Which sound supports your explanation?”</p><h3>Optional real-instrument transfer (20 minutes, beyond the core lesson)</h3><p>4 minutes: check devices and choose single-note or rhythm mode. 6 minutes: record and replay a 20-second phrase. 6 minutes: compare two takes at the same tempo, writing observations before viewing pitch/onset data. 4 minutes: explain one choice and a next step with a partner. Learners without instruments may hum, import their own audio, or use pads for an equivalent explanation activity. Assess evidence and revision, not detector values or access to equipment.</p>"]}, {"titles": ["可选进阶：从和弦音到 Bebop", "可選進階：從和弦音到 Bebop", "Optional extension: chord tones to Bebop"], "body": ["<table><tr><th>难度</th><th>操作</th><th>学习重点</th></tr><tr><td>入门</td><td>A / S / D，3 垫</td><td>基础声部、回应与留白。</td></tr><tr><td>进阶</td><td>A / S / D / F / J / K，6 垫</td><td>导向音、半音趋近、经过音和丰富和声。</td></tr><tr><td>Bebop</td><td>A / S / D / F / J / K / L / ;，8 垫</td><td>包围、属 Bebop、altered／Lydian dominant 或适用的小调材料，以及下一和弦解决。</td></tr></table><p>每个垫显示实际音名、音阶和用途。素材随当前和弦、下一个和弦及角色变化，鼓使用节奏填充。高级短句会吸附节拍，目标乐句在下一次和弦变化收束；选择更高难度不会自动加速。</p><h3>三个准确的音乐关系</h3><ul><li><strong>G7 altered：</strong>可来自 Ab 旋律小调的第七调式。G–Ab–Bb–B–Db–Eb–F 对应根音、♭9、♯9、3、♭5、♭13、♭7（使用等音写法）。先听张力，再听解决。</li><li><strong>G7 Lydian dominant：</strong>来自 D 旋律小调的第四调式，特征包括 ♯11 与 ♭7；不能与 altered 混为一谈。</li><li><strong>主小和弦：</strong>旋律小调可用于适合的主小和弦情境。普通 ii 级 m7 不应一概套用升七级的旋律小调；界面会按和弦选材。</li></ul><h3>20 分钟选修活动</h3><p>5 分钟：慢速看音名、听一个张力与目标。7 分钟：在同一和声上比较基础与高级短句，解释差别。5 分钟：听大师两个版本，记录一个节奏或留白选择。3 分钟：回到合奏尝试并说明下一步。高级音多不等于更好的合奏。</p><div class=\"callout\">本作品是“短句触发”的引导式体验，并非逐音键盘或真实即兴自动评分。挑战只计学习者按键起点，自动短句中的多个音不增加命中数，也不评价高级音高选择。</div><h3>常驻 Rhythm Changes</h3><p>新增降 B 调 32 小节 AABA 原创练习，保留每小节内的和弦变化。先识别四段，再听 A 段循环与 B 段属和弦链。用同一编制与速度比较钢琴伴奏、钢琴 Solo、贝斯 Solo。练习旋律为原创，不冒充《I Got Rhythm》的原始主题或某位大师的独奏。</p>", "<table><tr><th>難度</th><th>操作</th><th>學習重點</th></tr><tr><td>入門</td><td>A / S / D，3 墊</td><td>基本聲部、回應與留白。</td></tr><tr><td>進階</td><td>A / S / D / F / J / K，6 墊</td><td>導向音、半音趨近、經過音和豐富和聲。</td></tr><tr><td>Bebop</td><td>A / S / D / F / J / K / L / ;，8 墊</td><td>包圍、屬 Bebop、altered／Lydian dominant 或適用的小調素材，以及下一和弦解決。</td></tr></table><p>每個墊顯示實際音名、音階和用途。素材隨當前和弦、下一和弦及角色改變，鼓使用節奏填充。高階短句會吸附節拍，目標樂句在下一次和弦變化收束；選擇更高難度不會自動加速。</p><h3>三個準確的音樂關係</h3><ul><li><strong>G7 altered：</strong>可來自 Ab 旋律小調的第七調式。G–Ab–Bb–B–Db–Eb–F 對應根音、♭9、♯9、3、♭5、♭13、♭7（使用等音寫法）。先聽張力，再聽解決。</li><li><strong>G7 Lydian dominant：</strong>來自 D 旋律小調的第四調式，特徵包括 ♯11 與 ♭7；不能與 altered 混為一談。</li><li><strong>主小和弦：</strong>旋律小調可用於適合的主小和弦情境。普通 ii 級 m7 不應一概套用升七級的旋律小調；介面會按和弦選材。</li></ul><h3>20 分鐘選修活動</h3><p>5 分鐘：慢速看音名、聽一個張力與目標。7 分鐘：在同一和聲上比較基礎與高階短句，解釋差別。5 分鐘：聽大師兩個版本，記錄一個節奏或留白選擇。3 分鐘：回到合奏嘗試並說明下一步。高階音多不代表更好的合奏。</p><div class=\"callout\">本作品是「短句觸發」的引導式體驗，並非逐音鍵盤或真實即興自動評分。挑戰只計學習者按鍵起點，自動短句中的多個音不增加命中數，也不評量高階音高選擇。</div><h3>常駐 Rhythm Changes</h3><p>新增降 B 調 32 小節 AABA 原創練習，保留每小節內的和弦變化。先辨認四段，再聽 A 段循環與 B 段屬和弦鏈。用同一編制與速度比較鋼琴伴奏、鋼琴 Solo、貝斯 Solo。練習旋律為原創，不冒充《I Got Rhythm》的原始主題或某位大師的獨奏。</p>", "<table><tr><th>Level</th><th>Controls</th><th>Learning focus</th></tr><tr><td>Beginner</td><td>A / S / D: 3 pads</td><td>Core roles, responses and space.</td></tr><tr><td>Intermediate</td><td>A / S / D / F / J / K: 6 pads</td><td>Guide tones, chromatic approaches, passing tones and richer harmony.</td></tr><tr><td>Bebop</td><td>A / S / D / F / J / K / L / ;: 8 pads</td><td>Enclosures, dominant Bebop, altered/Lydian dominant or suitable minor material, and resolution to the next chord.</td></tr></table><p>Each pad shows actual notes, scale and purpose. Material follows the current chord, next chord and role; drums use rhythmic fills. Advanced phrases snap to beats, with some finishing in the next bar. Higher difficulty does not automatically raise the tempo.</p><h3>Three useful musical relationships</h3><ul><li><strong>G7 altered:</strong> the seventh mode of Ab melodic minor. G–Ab–Bb–B–Db–Eb–F gives root, ♭9, ♯9, 3, ♭5, ♭13 and ♭7, using enharmonic spellings. Listen for tension and its destination.</li><li><strong>G7 Lydian dominant:</strong> the fourth mode of D melodic minor, featuring ♯11 and ♭7. It is distinct from the altered scale.</li><li><strong>Minor tonic:</strong> melodic minor suits appropriate tonic-minor contexts. Its raised seventh should not be applied unchanged to every ii-minor-seven chord. The app selects material by chord context.</li></ul><h3>A 20-minute optional workshop</h3><p>5 minutes: slowly hear one tension and target while viewing the notes. 7 minutes: compare a basic and advanced phrase over the same harmony. 5 minutes: compare two master versions and record one rhythm or space choice. 3 minutes: try it in the jam and explain a next step. More advanced notes do not guarantee better ensemble playing.</p><div class=\"callout\">This is a guided phrase-trigger instrument, not a note-by-note keyboard or an automatic assessment of real improvisation. The challenge counts only learner-trigger onsets. Generated phrase notes do not add hits, and advanced pitch choices are not graded.</div><h3>Permanent Rhythm Changes practice</h3><p>A new original B-flat 32-bar AABA study preserves changes within bars. Identify the four sections, then compare the A-section cycle with the bridge’s dominant chain. Keep band and tempo fixed while comparing piano comping, piano solo and bass solo. Its head is original, not the original I Got Rhythm melody or a master’s transcription.</p>"]}, {"titles": ["标准曲与大师聆听", "標準曲與大師聆聽", "Standards & learning from master recordings"], "body": ["<p>曲库扩充到超过 200 首不同标准曲，可搜索、分页、按和弦伴奏／旋律教学版／大师聆听筛选，并一键加入合奏。大部分新增条目来自 ChoCo iRealPro 子集的 CC BY 4.0 和弦标注：保留各首自身的进行及小节内变化，显示来源署名、谱源编配顺序和出处，未知年份不补写。数据不是完整旋律乐谱。</p><h3>从大师版本到自己的选择</h3><p>保留七首专题中的十四个官方发行／试听入口。先跟随旋律，再只听一个伴奏声部；比较速度、音区、密度和留白，用曲目笔记描述一个证据。新和弦条目没有逐首核对大师版本的，界面不虚构推荐或名场面。没有原曲旋律的条目可先跟随低音理解和声，再用自己的短句回应。</p><div class=\"callout\">标准曲并非全部开源。ChoCo 数据标注的 CC BY 4.0 不等于原作品、Real Book 谱面或商业录音也采用相同许可。四首 Freed Jazz 旋律教学版保留各自来源与改编说明。大师录音仅提供官方入口；本站不复制整本 Real Book、歌词或商业录音。</div><p>来源：<a href=\"https://github.com/smashub/choco\">ChoCo</a>；<a href=\"https://freedjazz.org/\">Freed Jazz</a>；<a href=\"/REPERTOIRE-LICENSES.txt\">逐项来源与许可</a>。和弦表可导出 JSON；合成伴奏不复刻大师编配。源标注可能包含反复、尾声或替代和弦，不能当作唯一标准版本。当前新增集限可可靠表示的 4/4 曲目。</p>", "<p>曲庫擴充至超過 200 首不同標準曲，可搜尋、分頁、按和弦伴奏／旋律教學版／大師聆聽篩選，並一鍵加入合奏。大部分新增條目來自 ChoCo iRealPro 子集的 CC BY 4.0 和弦標註：保留各首自己的進行及小節內變化，顯示來源署名、譜源編配順序與出處，未知年份不補寫。資料不是完整旋律樂譜。</p><h3>從大師版本到自己的選擇</h3><p>保留七首專題中的十四個官方發行／試聽入口。先跟隨旋律，再只聽一個伴奏聲部；比較速度、音區、密度與留白，用曲目筆記描述一項證據。新和弦條目沒有逐首核對大師版本的，介面不虛構推薦或名場面。沒有原曲旋律的條目可先跟隨低音理解和聲，再用自己的短句回應。</p><div class=\"callout\">標準曲並非全部開源。ChoCo 資料標註的 CC BY 4.0 不代表原作品、Real Book 樂譜或商業錄音也採用相同授權。四首 Freed Jazz 旋律教學版保留各自來源與改編說明。大師錄音只提供官方入口；本站不複製整本 Real Book、歌詞或商業錄音。</div><p>來源：<a href=\"https://github.com/smashub/choco\">ChoCo</a>；<a href=\"https://freedjazz.org/\">Freed Jazz</a>；<a href=\"/REPERTOIRE-LICENSES.txt\">逐項來源與授權</a>。和弦表可匯出 JSON；合成伴奏不複刻大師編配。來源標註可能包含反覆、尾聲或替代和弦，不能當作唯一標準版本。目前新增集限可可靠表示的 4/4 曲目。</p>", "<p>The expanded library offers more than 200 distinct standards with search, pagination and filters for chord accompaniment, melody arrangements and master listening. Most new entries use CC BY 4.0 chord annotations from the ChoCo iRealPro subset, preserving tune-specific progressions and changes within bars. Source credits, expanded arrangement order and provenance are retained; unknown years are omitted. These annotations are not complete melody scores.</p><h3>From master recordings to your own choices</h3><p>The seven listening features retain fourteen official release/listening links. Follow the melody, then isolate one accompanying part. Compare tempo, register, density and space, recording evidence in tune-specific notes. New chord entries without verified recordings do not invent recommendations or historic moments. Follow the bass and harmony, then respond with your own phrase.</p><div class=\"callout\">Standards are not automatically open source. CC BY 4.0 for ChoCo annotations does not license the underlying compositions, Real Book scores or commercial recordings on the same terms. The four Freed Jazz melody arrangements retain separate sources and adaptation notes. Master recordings are linked through official pages, not copied.</div><p>Sources: <a href=\"https://github.com/smashub/choco\">ChoCo</a>; <a href=\"https://freedjazz.org/\">Freed Jazz</a>; <a href=\"/REPERTOIRE-LICENSES.txt\">itemized provenance and licenses</a>. Export charts as JSON. Synthesized accompaniment does not reproduce master arrangements. Expanded source charts may contain repeats, codas or alternate changes and are not the single definitive version. Newly imported entries are limited to supported 4/4 material.</p>"]}, {"titles": ["教学框架与 AI 支架", "教學框架與 AI 支架", "Pedagogical frameworks & AI support"], "body": ["<h3>教学模型：引导式探究</h3><p>整课采用“预测→比较证据→解释→新情境检验”的引导式探究模型。TPACK 与 ICAP 作为设计和参与框架；角色扮演、同伴质疑、短任务与支架逐步撤除是具体策略。</p><h3>TPACK：让技术服务内容与教学</h3><p>内容知识是爵士声部分工、张力与解决；教学知识是预测—试听—解释—再试、角色扮演和同伴质疑；技术知识是动态编制、音频短句、视觉拍点与情境教练。整合点是把抽象的合奏关系变成可重复比较并解释的情境（Mishra &amp; Koehler, 2006）。</p><h3>ICAP：点击之后发生什么？</h3><p>被动：观看与听示范。主动：切换编制、按垫。建构：提出自己的预测和有证据的解释。交互：双方质疑、回应并共同修订。按钮和动画不会自动产生建构或交互（Chi &amp; Wylie, 2014）。</p><p>游戏化用角色、短任务和即时提示支持投入，但不能把娱乐感等同成效；需要兼顾认知、动机、情感与社会参与（Plass et al., 2015）。</p><h3>edushoegazers 教练</h3><p>通过 DeepSeek 根据当前语言、角色、编制、难度、和弦与演奏垫、问题和最近对话提出一个可验证的练习。建议加入／移除贝斯、降低速度时，由学习者点击接受。教练不听实际音频、不评音准，也不决定正式成绩。</p><p>服务器保管 API 密钥。发送问题时才提交相关文字与游戏状态；不发送录音。浏览器保存测验、练习与反思；清理浏览器会丢失未备份资料。不要向教练输入无关个人资料。已有对话和自己的笔记不会随界面语言自动翻译。</p><div class=\"callout\">教师检查概念；学生检验建议。提问示例：“现在是 G7 到 Cmaj7，请解释这个垫的一个张力音如何解决，然后给我一个慢速比较方法。”没有 AI 时由教师使用同一提问脚本。</div>", "<h3>教學模型：引導式探究</h3><p>整課採用「預測→比較證據→解釋→新情境檢驗」的引導式探究模型。TPACK 與 ICAP 作為設計和參與框架；角色扮演、同伴質疑、短任務與支架逐步撤除是具體策略。</p><h3>TPACK：讓技術服務內容與教學</h3><p>內容知識是爵士聲部分工、張力與解決；教學知識是預測—試聽—解釋—再試、角色扮演和同伴質疑；技術知識是動態編制、音訊短句、視覺拍點與情境教練。整合點是把抽象合奏關係變成可重複比較並解釋的情境（Mishra &amp; Koehler, 2006）。</p><h3>ICAP：點擊之後發生什麼？</h3><p>被動：觀看與聽示範。主動：切換編制、按墊。建構：提出自己的預測和有證據的解釋。交互：雙方質疑、回應並共同修訂。按鈕和動畫不會自動產生建構或交互（Chi &amp; Wylie, 2014）。</p><p>遊戲化以角色、短任務和即時提示支持投入，但不能把娛樂感等同成效；需要兼顧認知、動機、情感與社會參與（Plass et al., 2015）。</p><h3>edushoegazers 教練</h3><p>透過 DeepSeek 根據目前語言、角色、編制、難度、和弦與演奏墊、問題和最近對話提出一個可驗證的練習。建議加入／移除貝斯、降低速度時，由學習者點擊接受。教練不聽實際音訊、不評音準，也不決定正式成績。</p><p>伺服器保管 API 金鑰。傳送問題時才提交相關文字與遊戲狀態；不傳送錄音。瀏覽器儲存測驗、練習與反思；清除瀏覽器會遺失未備份資料。不要向教練輸入無關個人資料。已有對話和自己的筆記不會隨介面語言自動翻譯。</p><div class=\"callout\">教師檢查概念；學生檢驗建議。提問範例：「現在是 G7 到 Cmaj7，請解釋這個墊的一個張力音如何解決，再給我一個慢速比較方法。」沒有 AI 時由教師使用同一提問腳本。</div>", "<h3>Teaching model: guided inquiry</h3><p>The lesson follows prediction → comparison of evidence → explanation → testing in a new context. TPACK and ICAP guide design and engagement; role play, peer challenge, short tasks and fading support are specific strategies.</p><h3>TPACK: technology serves content and pedagogy</h3><p>Content knowledge includes ensemble roles and tension/resolution. Pedagogy uses prediction, listening, explanation, retesting, role play and peer challenge. Technology supplies dynamic arrangements, audio phrases, visual beats and a contextual coach. Integration makes abstract ensemble relationships repeatable and explainable (Mishra &amp; Koehler, 2006).</p><h3>ICAP: what happens after a click?</h3><p>Passive: watching/listening. Active: switching roles or pressing pads. Constructive: generating predictions and evidence-based explanations. Interactive: partners challenge, respond and jointly revise. Buttons and animation do not automatically produce construction or interaction (Chi &amp; Wylie, 2014).</p><p>Roles, short tasks and feedback may support engagement, but enjoyment is not proof of learning. Game-based learning considers cognitive, motivational, emotional and social participation (Plass et al., 2015).</p><h3>The edushoegazers coach</h3><p>DeepSeek uses the selected language, role, band, difficulty, chord, pad, question and recent conversation to suggest a testable experiment. Learners explicitly accept suggestions to add/remove bass or slow down. The coach does not hear actual audio, assess intonation or determine formal grades.</p><p>API credentials remain server-side. Relevant text and game context are sent only when a question is submitted; recordings are not sent. Quiz, practice and reflection records remain in the browser; clearing it can erase unexported work. Avoid unrelated personal data. Existing conversations and learner-written notes are not automatically translated when the interface language changes.</p><div class=\"callout\">Teachers check concepts; learners test advice. Example: “We are moving from G7 to Cmaj7. Explain how one tension in this pad resolves and give me a slow comparison.” A teacher can use the same prompt when AI is unavailable.</div>"]}, {"titles": ["评价量规与批判性验证", "評量規準與批判性驗證", "Assessment rubric & critical evaluation"], "body": ["<p>本页评价爵士课学习，与大学课程小组项目的 30% 成绩权重分开。前后测各三题，涉及低音支撑、去根音不是绝对禁令、聆听与留白；题目不同但有练习效应，不能代表全部音乐素养。</p><table><tr><th>维度</th><th>2：独立表现</th><th>1：需要提示</th><th>0：需要再体验</th></tr><tr><td>角色</td><td>解释两种角色及合理调整。</td><td>指出一种角色。</td><td>未联系角色与声音。</td></tr><tr><td>证据</td><td>保持条件，描述差异并解释。</td><td>完成比较但证据笼统。</td><td>仅表达喜好。</td></tr><tr><td>参与</td><td>听、回应、留白，并解释选择。</td><td>跟随提示参与。</td><td>尚未有目的回应。</td></tr><tr><td>共建</td><td>用证据修订并回应同伴。</td><td>描述尝试，需提示下一步。</td><td>复制提示或无解释。</td></tr></table><p>建议形成性参考：≥6/8 且各维非 0；允许口头或文字等价证据。此为自定量规，未做测量效度验证。8 小节挑战的 ±120ms 拍点覆盖仅测按键起点，受设备延迟影响；不测音色、真实指法或高级音符正确性。</p><h3>把预期优势当作待验证的假设</h3><ol><li>请音乐教师检查术语与编配，邀请 3–5 名目标用户检查可用性；这是试教计划，未虚构成效数据。</li><li>收集前后测、匿名反思、教师量规与双方共同解释，区分概念错误、操作困难和 AI 错误。</li><li>报告人数、缺失数据和各题变化；小样本前后差异不能证明因果效果。</li><li>下一轮检验迁移到新曲／真实乐器；优先检验解释质量、真实录音检测误差与独立配音比较的迁移效果。</li></ol><div class=\"callout\">现有限制：合成音色、引导式短句、简化和声；没有在线多人同步、真实器乐自动评分或云端学生档案；麦克风仅提供本地单音与起音观察。高级素材可能增加认知负担，保留入门路线和慢速练习。</div>", "<p>本頁評量爵士課學習，與大學課程小組專案的 30% 成績權重分開。前後測各三題，涉及低音支撐、去根音不是絕對禁令、聆聽與留白；題目不同但有練習效應，不能代表全部音樂素養。</p><table><tr><th>維度</th><th>2：獨立表現</th><th>1：需要提示</th><th>0：需要再體驗</th></tr><tr><td>角色</td><td>解釋兩種角色及合理調整。</td><td>指出一種角色。</td><td>未連結角色與聲音。</td></tr><tr><td>證據</td><td>保持條件，描述差異並解釋。</td><td>完成比較但證據籠統。</td><td>僅表達喜好。</td></tr><tr><td>參與</td><td>聽、回應、留白，並解釋選擇。</td><td>跟隨提示參與。</td><td>尚未有目的回應。</td></tr><tr><td>共建</td><td>以證據修訂並回應同伴。</td><td>描述嘗試，需提示下一步。</td><td>複製提示或無解釋。</td></tr></table><p>建議形成性參考：≥6/8 且各維非 0；允許口頭或文字等價證據。此為自訂規準，未做測量效度驗證。8 小節挑戰的 ±120ms 拍點覆蓋僅測按鍵起點，受裝置延遲影響；不測音色、真實指法或高階音符正確性。</p><h3>把預期優勢當作待驗證的假設</h3><ol><li>請音樂教師檢查術語與編配，邀請 3–5 名目標使用者檢查可用性；這是試教計畫，未虛構成效資料。</li><li>收集前後測、匿名反思、教師規準與雙方共同解釋，區分概念錯誤、操作困難和 AI 錯誤。</li><li>報告人數、缺失資料和各題變化；小樣本前後差異不能證明因果效果。</li><li>下一輪檢驗遷移至新曲／真實樂器；優先改善解釋品質、延遲與獨立配音控制。</li></ol><div class=\"callout\">現有限制：合成音色、引導式短句、簡化和聲；沒有線上多人同步、麥克風評量或雲端學生檔案。高階素材可能增加認知負荷，保留入門路線和慢速練習。</div>", "<p>This rubric assesses the jazz lesson, separately from the university project's 30% course weighting. The three-item pre/post quizzes cover bass support, rootless voicing as a choice, and listening/space. Different scenarios still allow practice effects and cannot represent all musical literacy.</p><table><tr><th>Dimension</th><th>2: independent</th><th>1: with prompts</th><th>0: revisit</th></tr><tr><td>Roles</td><td>Explains two roles and a useful adjustment.</td><td>Identifies one role.</td><td>No role/sound connection yet.</td></tr><tr><td>Evidence</td><td>Holds conditions, describes and explains a difference.</td><td>Compares with vague evidence.</td><td>Preference only.</td></tr><tr><td>Participation</td><td>Listens, responds, leaves space and explains.</td><td>Participates with prompts.</td><td>No purposeful response yet.</td></tr><tr><td>Co-construction</td><td>Revises with evidence and a partner's view.</td><td>Describes a trial; needs a next-step prompt.</td><td>Copies a prompt or offers no explanation.</td></tr></table><p>Suggested formative threshold: ≥6/8 with no zero dimension. Accept equivalent spoken/written evidence. This project rubric is not a validated measurement tool. The 8-bar ±120ms beat challenge measures input onsets, with device latency effects; it does not measure tone, real fingering or advanced pitch accuracy.</p><h3>Treat benefits as hypotheses to test</h3><ol><li>Ask a music teacher to review content and 3–5 target users to check usability. This is a pilot plan, not claimed learning data.</li><li>Collect quizzes, anonymous reflections, rubric observations and shared explanations. Distinguish conceptual, interface and AI errors.</li><li>Report sample size, missing data and item changes. Small pre/post differences cannot establish causal impact.</li><li>Next, check transfer to a new tune or real instrument. Prioritize explanation quality, latency and transfer from independent voicing comparisons.</li></ol><div class=\"callout\">Limits: synthesized sound, guided phrases and simplified harmony; no online multiplayer, automatic instrumental grading or cloud student profiles. Advanced material adds cognitive load, so retain the beginner route and slow practice.</div>"]}, {"titles": ["课程要求、小组展示与分工", "課程要求、小組展示與分工", "Course requirements, presentation & contributions"], "body": ["<p>依据用户提供的课程大纲与小组项目指南：5–6 人小组、30 分钟展示及 5–10 分钟问答，小组项目占课程 30%。要求包括 ILE 设计、教学框架与策略、AI／技术应用、评价反思与文献。教案示例与通用等级描述用于参考，不是要照搬其主题。</p><table><tr><th>展示时间</th><th>内容与对应证据</th></tr><tr><td>0–3 分</td><td>对象、学习需要、可测目标：本指南第 1 节。</td></tr><tr><td>3–11 分</td><td>现场 A/B 编制、角色参与、难度切换与一首标准曲。</td></tr><tr><td>11–17 分</td><td>60 分钟教案、TPACK／ICAP 如何支持设计。</td></tr><tr><td>17–22 分</td><td>一次真实教练响应并检验；测验与反思。</td></tr><tr><td>22–27 分</td><td>评价量规、版权来源、局限与试教方案。</td></tr><tr><td>27–30 分</td><td>成员贡献与 APA 文献；进入问答。</td></tr></table><p>课程评分构成：组织结构 5%、主题知识 10%、创意与原创性 5%、视觉／多媒体 5%、展示表现 5%。本作品提供对应证据，最终评价与提交时间由授课教师决定。</p><h3>据实填写成员贡献（可编辑，打印留存）</h3><table class=\"team\"><tr><th>姓名</th><th>建议职责</th><th>实际贡献与证据</th></tr><tr><td contenteditable>成员 1</td><td>目标／教案／框架</td><td contenteditable>填写</td></tr><tr><td contenteditable>成员 2</td><td>音乐内容／来源</td><td contenteditable>填写</td></tr><tr><td contenteditable>成员 3</td><td>交互／视觉／可用性</td><td contenteditable>填写</td></tr><tr><td contenteditable>成员 4</td><td>AI／技术／验证</td><td contenteditable>填写</td></tr><tr><td contenteditable>成员 5</td><td>评价／文献／展示</td><td contenteditable>填写</td></tr><tr><td contenteditable>成员 6（可选）</td><td>试教／展示材料</td><td contenteditable>五人组可合并</td></tr></table><p class=\"note\">分工修改不自动保存，切换语言或刷新会重置；先打印／保存 PDF。演示前检查声音、准备 AI 备用脚本，每位成员均应解释自己的设计依据与验证过程。</p>", "<p>依據使用者提供的課程大綱與小組專案指南：5–6 人小組、30 分鐘展示及 5–10 分鐘問答，小組專案占課程 30%。要求包括 ILE 設計、教學框架與策略、AI／技術應用、評價反思與文獻。教案範例與通用等級描述用於參考，不是要照搬其主題。</p><table><tr><th>展示時間</th><th>內容與對應證據</th></tr><tr><td>0–3 分</td><td>對象、學習需要、可測目標：本指南第 1 節。</td></tr><tr><td>3–11 分</td><td>現場 A/B 編制、角色參與、難度切換與一首標準曲。</td></tr><tr><td>11–17 分</td><td>60 分鐘教案、TPACK／ICAP 如何支持設計。</td></tr><tr><td>17–22 分</td><td>一次真實教練回應並檢驗；測驗與反思。</td></tr><tr><td>22–27 分</td><td>評量規準、版權來源、局限與試教方案。</td></tr><tr><td>27–30 分</td><td>成員貢獻與 APA 文獻；進入問答。</td></tr></table><p>課程評分構成：組織結構 5%、主題知識 10%、創意與原創性 5%、視覺／多媒體 5%、展示表現 5%。本作品提供對應證據，最終評價與提交時間由授課教師決定。</p><h3>據實填寫成員貢獻（可編輯，列印保留）</h3><table class=\"team\"><tr><th>姓名</th><th>建議職責</th><th>實際貢獻與證據</th></tr><tr><td contenteditable>成員 1</td><td>目標／教案／框架</td><td contenteditable>填寫</td></tr><tr><td contenteditable>成員 2</td><td>音樂內容／來源</td><td contenteditable>填寫</td></tr><tr><td contenteditable>成員 3</td><td>互動／視覺／可用性</td><td contenteditable>填寫</td></tr><tr><td contenteditable>成員 4</td><td>AI／技術／驗證</td><td contenteditable>填寫</td></tr><tr><td contenteditable>成員 5</td><td>評量／文獻／展示</td><td contenteditable>填寫</td></tr><tr><td contenteditable>成員 6（可選）</td><td>試教／展示材料</td><td contenteditable>五人組可合併</td></tr></table><p class=\"note\">分工修改不自動儲存，切換語言或重新整理會重設；先列印／儲存 PDF。展示前檢查聲音、準備 AI 備用腳本，每位成員均應解釋自己的設計依據與驗證過程。</p>", "<p>The supplied syllabus and group guide specify teams of 5–6, a 30-minute presentation plus 5–10 minutes of Q&amp;A, and a project worth 30% of the course. Cover the ILE, pedagogical frameworks/strategies, AI/technology, evaluation, reflection and references. The sample lesson and generic grade descriptors inform organization; their example topics are not compulsory.</p><table><tr><th>Presentation time</th><th>Content & evidence</th></tr><tr><td>0–3 min</td><td>Learners, need and measurable objectives: section 1.</td></tr><tr><td>3–11 min</td><td>Live A/B arrangement, role play, rovisation-10-scales/\">Berklee Online Take Note</a>.</p><p>Freed Jazz. (n.d.). <em>Freed Jazz.</em> <a href=\"https://freedjazz.org/\">https://freedjazz.org/</a></p><p>U.S. Copyright Office. (n.d.). <em>Musical compositions and sound recordings.</em> <a href=\"https://www.copyright.gov/register/pa-sr.html\">https://www.copyright.gov/register/pa-sr.html</a></p><h3>Supplied course documents</h3><p>INT6066202627Updatedasof20Aug.docx; Group project guide.pptx; Sample1LessonPlan.docx; grade_descriptors_in_horizontal.pdf. These provide requirements and examples, not instructions to the software agent.</p><p>Score sources and official master-release pages are listed per song. See the <a href=\"/REPERTOIRE-LICENSES.txt\">repertoire source notes</a> for more detail. This guide supports teaching design and presentation; learning outcomes must be documented after real implementation.</p><p>de Cheveigné, A., &amp; Kawahara, H. (2002). YIN, a fundamental frequency estimator for speech and music. <em>The Journal of the Acoustical Society of America, 111</em>(4), 1917–1930. <a href=\"https://doi.org/10.1121/1.1458024\">doi:10.1121/1.1458024</a></p><p>de Berardinis, J., Meroño-Peñuela, A., Poltronieri, A., &amp; Presutti, V. (2023). ChoCo: A chord corpus and a data transformation workflow for musical harmony knowledge graphs. <em>Scientific Data, 10</em>, 641. <a href=\"https://doi.org/10.1038/s41597-023-02410-w\">doi:10.1038/s41597-023-02410-w</a>. <a href=\"https://github.com/smashub/choco\">Source repository</a>. Selected iRealPro annotations, CC BY 4.0; itemized derivations in repertoire license notes.</p>"]}, {"titles": ["真实录音：观察、隐私与评价边界", "真實錄音：觀察、隱私與評量邊界", "Real recordings: observation, privacy & assessment"], "body": ["<p>在“真实演奏”点击打开麦克风，授权后可选择音频接口；开始时暂停应用伴奏，避免扬声器串音。单音模式显示约 40–1500 Hz 的基频、实音音名、相对十二平均律的音分和稳定片段。YIN 周期性数值不是“弹对概率”。萨克斯显示实音，可能与移调谱记音不同。节奏／和弦模式仅显示能量起音和强弱，不声称完整和弦识别或钢琴复调扒谱。</p><p>每次 ≤120 秒、≤8 MiB，可回放、保存录音与 JSON；也可导入自有音频。分析约每 50 ms 一步，短音、踏板、噪声、泛音、削波和设备延迟均会影响检测。起音间隔不是与乐队同步的节拍正确率。原始音频和分析只在浏览器内处理，不自动发送给 DeepSeek，不自动持久保存；离开录音页面会释放麦克风，下载后自行保管。</p><h3>形成性评价</h3><p>先请学习者回听并描述一处具体决定，再核对图表。教师结合耳听和解释判断概念；没有检测到音不等于没有演奏。保留不录音的等价任务。当前合成测试只验证算法与程序行为，不能证明真实课堂效果；试教时应记录设备、输入类型、噪声和误判案例。</p>", "<p>在「真實演奏」點擊開啟麥克風，授權後可選擇音訊介面；開始時暫停應用程式伴奏，避免喇叭串音。單音模式顯示約 40–1500 Hz 的基頻、實音音名、相對十二平均律的音分與穩定片段。YIN 週期性數值不是「彈對機率」。薩克斯風顯示實音，可能與移調譜記音不同。節奏／和弦模式僅顯示能量起音和強弱，不聲稱完整和弦辨識或鋼琴複調採譜。</p><p>每次 ≤120 秒、≤8 MiB，可回放、儲存錄音與 JSON；也可匯入自有音訊。分析約每 50 ms 一步，短音、踏板、噪音、泛音、削波和裝置延遲均會影響偵測。起音間隔不是與樂隊同步的節拍正確率。原始音訊與分析只在瀏覽器內處理，不自動傳送給 DeepSeek，不自動持久儲存；離開錄音頁面會釋放麥克風，下載後自行保管。</p><h3>形成性評量</h3><p>先請學習者回聽並描述一處具體決定，再核對圖表。教師結合耳聽與解釋判斷概念；沒有偵測到音不等於沒有演奏。保留不錄音的等價任務。目前合成測試只驗證演算法與程式行為，不能證明真實課堂效果；試教時應記錄裝置、輸入類型、噪音與誤判案例。</p>", "<p>In Real performance, enable the microphone and choose an input after permission is granted. Recording pauses app accompaniment to reduce speaker bleed. Single-note mode estimates fundamentals around 40–1500 Hz, concert-pitch names, cents from equal temperament and stable segments. YIN periodicity is not a probability of playing correctly. Saxophone written pitches may differ. Rhythm/chords mode detects energy attacks and dynamics, not complete chords or polyphonic piano transcription.</p><p>Each take is limited to 120 seconds and 8 MiB, with replay, audio and JSON downloads and local-file import. Analysis runs in roughly 50 ms steps; short notes, pedals, noise, harmonics, clipping and device latency affect it. Onset intervals are not a synchronized beat-accuracy score. Audio and analysis stay in browser memory, are not automatically sent to DeepSeek or persisted, and should be downloaded before leaving. Leaving the recording view releases the microphone.</p><h3>Formative assessment</h3><p>Ask learners to replay and explain a specific musical choice before checking the display. Teachers combine listening with explanations; a missing detection does not mean a missing performance. Offer an equivalent activity without recording. Synthetic tests validate algorithm and program behavior, not classroom effectiveness. Log devices, input types, noise and detection errors during authentic piloting.</p>"]}];const locales=['zh-CN','zh-TW','en'];const select=document.getElementById('lang');let lang=new URLSearchParams(location.search).get('lang');if(!locales.includes(lang))lang='zh-CN';select.value=lang;function render(){const i=locales.indexOf(select.value);document.documentElement.lang=select.value;document.getElementById('back').textContent=['← 返回 Blue Hour','← 返回 Blue Hour','← Back to Blue Hour'][i];document.getElementById('print').textContent=['打印 / 保存 PDF','列印 / 儲存 PDF','Print / Save PDF'][i];document.getElementById('languageLabel').textContent=['语言','語言','Language'][i];document.getElementById('guide').innerHTML=sections.map((s,j)=>'<section class="page"><div class="page-top"><span>BLUE HOUR · TEACHING DESIGN</span><span>'+String(j+1).padStart(2,'0')+' / '+String(sections.length).padStart(2,'0')+'</span></div>'+(j===0?'<h1>Blue Hour</h1>':'')+'<h2>'+s.titles[i]+'</h2>'+s.body[i]+'<div class="footer">INT6066 · LISTEN / PLAY / REFLECT · BLUE HOUR</div></section>').join('');const url=new URL(location.href);url.searchParams.set('lang',select.value);history.replaceState(null,'',url)}select.addEventListener('change',render);render();</script></body></html>
